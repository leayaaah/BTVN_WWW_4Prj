spring.application.name=employee-spring-data-jpa
server.port=8083
app.technology=Spring Data JPA

# --- Database SQL: employeedb (MariaDB/MySQL)
spring.datasource.url=jdbc:mariadb://localhost:3306/employeedb?useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=sapassword
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# --- Thymeleaf ---
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.suffix=.html
spring.thymeleaf.prefix=classpath:/templates/

spring.web.locale=en_US
spring.web.locale-resolver=fixed
