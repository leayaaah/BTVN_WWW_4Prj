<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' - Quản lý nhân viên'">Quản lý nhân viên</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid flex-wrap">
        <a class="navbar-brand" th:href="@{/employees}">
            Quản lý nhân viên
            <span class="badge bg-secondary" th:text="${@environment.getProperty('app.technology')}">Công nghệ</span>
        </a>
        <div class="d-flex flex-wrap gap-3">
            <a class="text-white text-decoration-none" th:href="@{/employees}">Danh sách</a>
            <a class="text-white text-decoration-none" th:href="@{/employees/new}">Thêm mới</a>
            <a class="text-white text-decoration-none" th:href="@{/employees/search}">Tìm kiếm</a>
            <span class="text-secondary">|</span>
            <a class="text-white text-decoration-none" th:href="@{/reports/by-position}">Theo chức vụ</a>
            <a class="text-white text-decoration-none" th:href="@{/reports/by-department-position}">Theo phòng ban + chức vụ</a>
            <a class="text-white text-decoration-none" th:href="@{/reports/department-count}">Số NV mỗi phòng</a>
            <a class="text-white text-decoration-none" th:href="@{/reports/department-salary}">Lương theo phòng</a>
            <a class="text-white text-decoration-none" th:href="@{/reports/top-paid}">Top lương</a>
            <a class="text-white text-decoration-none" th:href="@{/reports/empty-departments}">Phòng chưa có NV</a>
        </div>
    </div>
</nav>

<div th:fragment="employeeTable(list)" class="table-responsive">
    <table class="table table-striped table-hover table-sm align-middle">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Họ tên</th>
            <th>Vai trò</th>
            <th>Tuổi</th>
            <th class="text-end">Lương (VND)</th>
            <th>Phòng ban</th>
            <th>Chức vụ</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="e : ${list}">
            <td th:text="${e.id}">1</td>
            <td th:text="${e.name}">Họ tên</td>
            <td th:text="${e.role}">Vai trò</td>
            <td th:text="${e.age}">25</td>
            <td class="text-end" th:text="${#numbers.formatDecimal(e.salary, 0, 'POINT', 0, 'COMMA')}">10.000.000</td>
            <td th:text="${e.departmentName}">Phòng ban</td>
            <td th:text="${e.positionTitle}">Chức vụ</td>
            <td class="text-end text-nowrap">
                <a class="btn btn-sm btn-outline-secondary" th:href="@{/employees/{id}(id=${e.id})}">Xem</a>
                <a class="btn btn-sm btn-outline-primary" th:href="@{/employees/{id}/edit(id=${e.id})}">Sửa</a>
                <form class="d-inline" method="post" th:action="@{/employees/{id}/delete(id=${e.id})}"
                      onsubmit="return confirm('Bạn có chắc muốn xóa nhân viên này?');">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Xóa</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
