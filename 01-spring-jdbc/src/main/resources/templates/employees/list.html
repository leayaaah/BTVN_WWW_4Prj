<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Danh sách nhân viên')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container-fluid px-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">Danh sách nhân viên
            <span class="badge bg-primary" th:text="${#lists.size(employees)}">0</span>
        </h3>
        <a class="btn btn-success" th:href="@{/employees/new}">+ Thêm nhân viên</a>
    </div>

    <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>

    <div th:replace="~{fragments/layout :: employeeTable(${employees})}"></div>
</div>
</body>
</html>
