spring.application.name=employee-spring-data-mongodb
server.port=8084
app.technology=Spring Data MongoDB

# --- Database NoSQL: employeewww (MongoDB chạy local, cổng mặc định 27017) ---
spring.data.mongodb.uri=mongodb://localhost:27017/employeewww

# --- Thymeleaf ---
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.suffix=.html
spring.thymeleaf.prefix=classpath:/templates/

spring.web.locale=en_US
spring.web.locale-resolver=fixed
